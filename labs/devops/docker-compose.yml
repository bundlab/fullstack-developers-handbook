version: '3.8'

services:
  api:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile
    container_name: handbook_api_service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres_user:secretpass@db:5432/handbook_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: handbook_postgres_db
    environment:
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=secretpass
      - POSTGRES_DB=handbook_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/lab_06_postgresql_design.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d handbook_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
